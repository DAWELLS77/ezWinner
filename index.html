<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a2b">
<title>ezWinner</title>
<style>
:root{--bg:#121a2b;--bg2:#1b2640;--slip:#eef2f7;--ink:#14213d;--mute:#6b778c;--gold:#f2b134;--win:#1f9d63;--lose:#d6454a;--wait:#c7861a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#e8edf6;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{padding:22px 0 14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
h1 b{color:var(--gold)}
.logo{height:48px;width:auto;max-width:100%;display:block}
.sub{color:#9fb0cc;font-size:14px}
.stats{display:flex;gap:10px;margin:14px 0}
.stat{flex:1;background:var(--bg2);border-radius:12px;padding:10px 12px}
.stat strong{display:block;font-size:22px}
.stat span{font-size:12px;color:#9fb0cc}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tabs button{flex:none;border:1px solid #33425f;background:none;color:#c9d4e8;padding:7px 14px;border-radius:99px;font:inherit;font-size:14px}
.tabs button.on{background:var(--gold);border-color:var(--gold);color:#14213d;font-weight:700}
.slip{background:var(--slip);color:var(--ink);border-radius:14px;margin-bottom:16px;position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;font-size:13px;color:var(--mute)}
.badge{font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;color:#fff}
.badge.win{background:var(--win)}.badge.lose{background:var(--lose)}.badge.wait{background:var(--wait)}
.row{padding:8px 16px;border-top:1px solid #d9e0ea}
.row small{display:block;color:var(--mute);font-size:12px}
.row strong{font-size:16px}
.row em{font-style:normal;font-weight:700;color:var(--ink)}
.cut{height:0;border-top:2px dashed #b9c4d6;margin:6px 0 0;position:relative}
.cut::before,.cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.cut::before{left:-10px}.cut::after{right:-10px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 16px;gap:10px}
.cote span{font-size:12px;color:var(--mute);display:block}
.cote b{font-size:24px}
.code{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font:inherit;text-align:right}
.code span{display:block;font-size:11px;color:#aebbd3}
.code b{font-size:18px;letter-spacing:1.5px;color:var(--gold)}
.site{padding:0 16px 12px;font-size:13px;color:var(--mute)}
.msg{text-align:center;color:#9fb0cc;padding:40px 10px}
.warn{font-size:12px;color:#8393b0;text-align:center;margin-top:20px}
.stat strong{font-size:20px}
.day{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#9fb0cc;margin:20px 2px 10px;font-weight:700}
.slip{border-left:5px solid #b9c4d6}.slip.win{border-left-color:var(--win)}.slip.lose{border-left-color:var(--lose)}.slip.wait{border-left-color:var(--wait)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.score{background:#dfe6f1;border-radius:8px;padding:3px 9px;font-weight:700;font-size:14px;white-space:nowrap}
.res{margin:8px 16px 4px;padding:9px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.res.win{background:#dff3e8;color:#14683f}.res.lose{background:#fbe3e4;color:#9b2a2f}.res.wait{background:#f6ecd7;color:#8a5a0c}
.foot{flex-wrap:wrap}.acts{display:flex;gap:8px}
.share{border:1px solid #b9c4d6;background:none;color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
#upd{font-size:12px;color:#7d8ea9;margin-top:2px}
.sections{display:flex;gap:2px;overflow-x:auto;background:var(--bg2);border-radius:12px;padding:4px;margin:12px 0}
.sections button{flex:1 0 auto;border:0;background:none;color:#9fb0cc;padding:9px 12px;border-radius:9px;font:inherit;font-size:14px;font-weight:700;white-space:nowrap}
.sections button.on{background:var(--gold);color:#14213d}
</style>
</head>
<body>
<header>
  <h1><img class="logo" src="logo.png" alt="ezWinner" onload="this.nextElementSibling.hidden=true" onerror="this.remove()"><span>ez<b>Winner</b></span></h1>
  <div class="sub">Pronostics et Betcodes du jour</div>
  <div id="upd"></div>
</header>
<div class="sections" id="sections"></div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<main id="list"><div class="msg">Chargement des pronostics…</div></main>
<p class="warn">Les pronostics ne garantissent aucun gain. Les paris comportent des risques : joue avec modération, 18 ans et plus.</p>

<script>
// Lien de ton Google Sheet publié (CSV)
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRBVGQOquwmXm5NUR67Fms_-UuliwBz0SRYQY-7tkBt89rgG6YsS-pMrkP1boWEJFo7aEBkOGNGeMKq/pub?gid=0&single=true&output=csv";

const $ = id => document.getElementById(id);
function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }

// Icône + manifeste pour « Ajouter à l’écran d’accueil »
(function(){
  const icon = "https://dawells77.github.io/ezWinner/logo.png";
  const m = {name:"ezWinner", short_name:"ezWinner", display:"standalone", background_color:"#121a2b", theme_color:"#121a2b", icons:[{src:icon, sizes:"512x512", type:"image/png"}]};
  const l = el("link"); l.rel = "manifest"; l.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m));
  document.head.appendChild(l);
  const i = el("link"); i.rel = "icon"; i.href = icon; document.head.appendChild(i);
})();

function parseCSV(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ","){ row.push(f); f = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && t[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if(f || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function toTickets(csv){
  const rows = parseCSV(csv);
  if(rows.length < 2) return [];
  const head = rows[0].map(h => h.trim().toLowerCase());
  return rows.slice(1).map(r => { const o = {}; head.forEach((h, i) => o[h] = (r[i] || "").trim()); return o; })
    .filter(o => o.betcode || Array.from({length:20}, (_, i) => o["match" + (i + 1)]).some(Boolean))
    .map(o => {
      const s = (o.statut || "").toLowerCase();
      o.etat = s.startsWith("gagn") ? "win" : s.startsWith("perd") ? "lose" : "wait";
      return o;
    })
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}

let tickets = [], filtre = "all", section = "pronos";
const isM = t => (t.type || "").toLowerCase().startsWith("montan");
const NBA_RE = /\b(nba|hawks|celtics|nets|hornets|bulls|cavaliers|cavs|mavericks|mavs|nuggets|pistons|warriors|rockets|pacers|clippers|lakers|grizzlies|heat|bucks|timberwolves|wolves|pelicans|knicks|thunder|magic|76ers|sixers|suns|blazers|trail blazers|raptors|jazz|wizards|san antonio|sacramento kings)\b/i;
const SCORE_RE = /^\s*\d{1,2}\s*[-:–]\s*\d{1,2}\s*$/;
const kind = t => {
  const y = (t.type || "").toLowerCase().replace(/[^a-z]/g, "");
  if(y.startsWith("montan")) return "montantes";
  if(y === "nba") return "nba";
  if(y.startsWith("correct") || y.startsWith("score")) return "score";
  if(t.palier) return "montantes";
  const ms = [], pr = [];
  for(let n = 1; n <= 20; n++){ if(t["match" + n]) ms.push(t["match" + n]); if(t["prono" + n]) pr.push(t["prono" + n]); }
  if(ms.length && ms.every(m => NBA_RE.test(m))) return "nba";
  if(pr.length && pr.every(p => SCORE_RE.test(p))) return "score";
  return "pronos";
};
const sectionTickets = () => tickets.filter(t => kind(t) === section);
const LABELS = {win:"Gagné", lose:"Perdu", wait:"En cours"};

function fmtDate(d){
  const x = new Date(d + "T00:00:00");
  return isNaN(x) ? d : x.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
}

function renderStats(){
  const T = sectionTickets();
  const w = T.filter(t => t.etat === "win").length;
  const l = T.filter(t => t.etat === "lose").length;
  const rate = (w + l) ? Math.round(100 * w / (w + l)) + " %" : "–";
  const box = $("stats"); box.innerHTML = "";
  [[rate, "Réussite"], [w, "Gagnés"], [l, "Perdus"], [T.length, "Tickets"]].forEach(([v, k]) => {
    const s = el("div", "stat"); s.append(el("strong", "", v), el("span", "", k)); box.appendChild(s);
  });
}

function renderSections(){
  const box = $("sections"); box.innerHTML = "";
  [["pronos","Pronostics"],["montantes","Montantes"],["nba","NBA"],["score","Correct score"]].forEach(([k, n]) => {
    const b = el("button", k === section ? "on" : "", n);
    b.onclick = () => { section = k; filtre = "all"; renderSections(); renderStats(); renderTabs(); renderList(); };
    box.appendChild(b);
  });
}

function renderTabs(){
  const box = $("tabs"); box.innerHTML = "";
  [["all","Tous"],["wait","En cours"],["win","Gagnés"],["lose","Perdus"]].forEach(([k, n]) => {
    const b = el("button", k === filtre ? "on" : "", n);
    b.onclick = () => { filtre = k; renderTabs(); renderList(); };
    box.appendChild(b);
  });
}

function dayLabel(d){
  const x = new Date(d + "T00:00:00");
  if(isNaN(x)) return d || "Sans date";
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((x - t) / 864e5);
  if(diff === 0) return "Aujourd’hui";
  if(diff === 1) return "Demain";
  if(diff === -1) return "Hier";
  return x.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
}

async function partager(t, ms, b){
  const txt = "ezWinner\n" + ms.map(m => m[0] + " → " + m[1]).join("\n") + "\nCote : " + (t.cote || "–") + (t.betcode ? "\nBetcode : " + t.betcode + (t.site ? " (" + t.site + ")" : "") : "") + "\n" + location.href.split("#")[0];
  try {
    if(navigator.share) await navigator.share({title:"ezWinner", text:txt});
    else { await navigator.clipboard.writeText(txt); b.textContent = "Copié ✓"; setTimeout(() => b.textContent = "Partager", 1800); }
  } catch(e){}
}

function renderList(){
  const box = $("list"); box.innerHTML = "";
  const items = sectionTickets().filter(t => filtre === "all" || t.etat === filtre);
  if(section === "montantes") items.sort((a, b) => (b.date || "").localeCompare(a.date || "") || (parseFloat(a.cote) || 0) - (parseFloat(b.cote) || 0));
  if(!items.length){ box.appendChild(el("div", "msg", "Aucun ticket dans cette catégorie pour le moment.")); return; }
  let last = null;
  items.forEach(t => {
    if(t.date !== last){ last = t.date; box.appendChild(el("h2", "day", dayLabel(t.date))); }
    const ms = [];
    for(let n = 1; n <= 20; n++) if(t["match" + n]) ms.push([t["match" + n], t["prono" + n] || "–", t["score" + n] || ""]);
    const s = el("article", "slip " + t.etat);
    const top = el("div", "top");
    top.append(el("span", "", isM(t) ? "Montante · " + (t.palier || "Cote " + (t.cote || "?")) : kind(t) === "nba" ? "NBA" : kind(t) === "score" ? "Correct score" : (ms.length > 1 ? "Combiné · " + ms.length + " matchs" : "Simple")), el("span", "badge " + t.etat, LABELS[t.etat]));
    s.appendChild(top);
    ms.forEach(m => {
      const r = el("div", "row"), l = el("div", "l");
      l.append(el("small", "", m[0]), el("strong", "", m[1]));
      r.appendChild(l);
      if(m[2]) r.appendChild(el("span", "score", m[2]));
      s.appendChild(r);
    });
    if(t.resultat){ const r = el("div", "res " + t.etat); r.append(el("span", "", "Résultat"), el("b", "", t.resultat)); s.appendChild(r); }
    s.appendChild(el("div", "cut"));
    const f = el("div", "foot");
    const c = el("div", "cote"); c.append(el("span", "", "Cote totale"), el("b", "", t.cote || "–"));
    const a = el("div", "acts");
    const sh = el("button", "share", "Partager"); sh.onclick = () => partager(t, ms, sh); a.appendChild(sh);
    if(t.betcode){
      const b = el("button", "code"); b.append(el("span", "", "Betcode · toucher pour copier"), el("b", "", t.betcode));
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(t.betcode); b.firstChild.textContent = "Copié ✓"; }
        catch(e){ b.firstChild.textContent = "Copie impossible, note le code"; }
        setTimeout(() => b.firstChild.textContent = "Betcode · toucher pour copier", 1800);
      };
      a.appendChild(b);
    }
    f.append(c, a); s.appendChild(f);
    if(t.site) s.appendChild(el("div", "site", "À jouer sur " + t.site));
    box.appendChild(s);
  });
}

async function load(){
  let csv = null;
  try {
    const r = await fetch(CSV_URL + "&t=" + Date.now());
    if(!r.ok) throw new Error(r.status);
    csv = await r.text();
    $("upd").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
    try { localStorage.setItem("ezw_csv", csv); } catch(e){}
  } catch(e){
    try { csv = localStorage.getItem("ezw_csv"); } catch(e2){}
  }
  if(csv === null){ $("list").innerHTML = ""; $("list").appendChild(el("div", "msg", "Impossible de charger les pronostics. Vérifie ta connexion et réessaie.")); return; }
  tickets = toTickets(csv);
  renderSections(); renderStats(); renderTabs(); renderList();
}
load();
setInterval(load, 120000);
</script>
</body>
</html>
